name: eventease
description: "EventEase - A modern cross-platform mobile event management application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1

  # State Management & Navigation
  provider: ^6.1.2
  go_router: ^14.8.0

  # UI, Fonts & Assets
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1

  # QR Code Scanning & Generation
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

  # Local Persistence
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
