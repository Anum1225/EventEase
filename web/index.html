<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="eventease">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>eventease</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    window.decodeQrFromImageData = async function(base64Data) {
      return new Promise((resolve) => {
        try {
          const img = new Image();
          img.onload = function() {
            try {
              if (window.BarcodeDetector) {
                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                detector.detect(img).then(barcodes => {
                  if (barcodes && barcodes.length > 0) {
                    resolve(barcodes[0].rawValue);
                    return;
                  }
                  fallbackJsQr();
                }).catch(() => fallbackJsQr());
              } else {
                fallbackJsQr();
              }
            } catch (e) {
              fallbackJsQr();
            }
          };
          function fallbackJsQr() {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = img.width;
              canvas.height = img.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              if (window.jsQR) {
                const code = window.jsQR(imageData.data, imageData.width, imageData.height);
                if (code && code.data) {
                  resolve(code.data);
                  return;
                }
              }
              resolve(null);
            } catch (e) {
              resolve(null);
            }
          }
          img.onerror = function() { resolve(null); };
          img.src = base64Data.startsWith('data:') ? base64Data : 'data:image/png;base64,' + base64Data;
        } catch (err) {
          resolve(null);
        }
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
